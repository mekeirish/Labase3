            }
        ];

        // ================================================================
        //  ÉTAT
        // ================================================================
        var ACTIVE_KEY = 'activePwa_pc_v15';
        var BASE_STORAGE = 'laBase_v4';

        var activePwaId = null;
        var loadedPwas = {};
        var currentSearch = '';

        function saveActive() {
            if (activePwaId) localStorage.setItem(ACTIVE_KEY, activePwaId);
            else localStorage.removeItem(ACTIVE_KEY);
        }

        // ================================================================
        //  LA BASE — stockage
        // ================================================================
        function getSnippets() {
            try {
                var raw = localStorage.getItem(BASE_STORAGE);
                if (!raw) return [];
                var arr = JSON.parse(raw);
                if (!Array.isArray(arr)) return [];
                return arr.map(function(s) {
                    return {
                        id: s.id || generateId(),
                        name: String(s.name || 'Sans nom'),
                        value: String(s.value || ''),
                        color: s.color || DEFAULT_COLOR,
                        icon: s.icon || DEFAULT_ICON
                    };
                });
            } catch (e) {
                return [];
            }
        }

        function saveSnippets(arr) {
            try {
                localStorage.setItem(BASE_STORAGE, JSON.stringify(arr));
            } catch (e) {
                showToast('Erreur de sauvegarde', true);
            }
        }

        function generateId() {
            return 'snip_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        }

        // ================================================================
        //  LONG PRESS SUR LE LOGO — VERSION ROBUSTE
        // ================================================================
        var introLogo = document.getElementById('intro-logo-wrap');
        var pressTimer = null;
        var pressStart = 0;
        var longPressTriggered = false;
        var capturedPointerId = null;

        function startLogoPress(e) {
            // Ne PAS preventDefault ici → cause des clics fantômes sur mobile
            // On utilise touch-action: none en CSS à la place

            e.stopPropagation();

            // Capture le pointeur pour ne rien perdre
            try {
                if (e.pointerId !== undefined) {
                    introLogo.setPointerCapture(e.pointerId);
                    capturedPointerId = e.pointerId;
                }
            } catch (err) {}

            pressStart = Date.now();
            longPressTriggered = false;
            introLogo.classList.add('pressing');
            vibrate(10);

            pressTimer = setTimeout(function() {
                longPressTriggered = true;
                pressTimer = null;
                introLogo.classList.remove('pressing');

                // ⚡ IMPORTANT : libérer immédiatement le pointeur
                releasePointer();

                // 🚫 Bloquer les clics fantômes pour 500ms
                suppressClicks(500);

                vibrate([20, 30, 20]);
                playSuccessSound();
                unlockBase();
            }, 600);
        }

        function releasePointer() {
            if (capturedPointerId !== null) {
                try {
                    introLogo.releasePointerCapture(capturedPointerId);
                } catch (err) {}
                capturedPointerId = null;
            }
        }

        function endLogoPress(e) {
            e.stopPropagation();

            if (pressTimer !== null) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            introLogo.classList.remove('pressing');
            releasePointer();

            if (!longPressTriggered && Date.now() - pressStart < 600) {
                vibrate(8);
                // Bloquer aussi les clics après un tap simple
                suppressClicks(200);
            }
            longPressTriggered = false;
        }

        function cancelLogoPress(e) {
            if (pressTimer !== null) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            introLogo.classList.remove('pressing');
            releasePointer();
            longPressTriggered = false;
        }

        introLogo.addEventListener('pointerdown', startLogoPress);
        introLogo.addEventListener('pointerup', endLogoPress);
        introLogo.addEventListener('pointerleave', cancelLogoPress);
        introLogo.addEventListener('pointercancel', cancelLogoPress);
        // Bloquer aussi les clicks naturels sur le logo
        introLogo.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        function unlockBase() {
            document.getElementById('home-intro').classList.add('hidden');
            document.getElementById('base-view').classList.add('visible');
            renderSnippets();
        }

        function lockBase() {
            document.getElementById('base-view').classList.remove('visible');
            document.getElementById('home-intro').classList.remove('hidden');
        }

        // ================================================================
        //  RENDU DES SNIPPETS
        // ================================================================
        var snippetsGrid = document.getElementById('snippets-grid');
        var baseCountEl = document.getElementById('base-count');
        var baseCountPlural = document.getElementById('base-count-plural');

        function renderSnippets(highlightId) {
            var list = getSnippets();

            baseCountEl.textContent = list.length;
            baseCountPlural.textContent = list.length > 1 ? 's' : '';

            if (currentSearch) {
                var q = currentSearch.toLowerCase();
                list = list.filter(function(s) {
                    return s.name.toLowerCase().indexOf(q) !== -1 ||
                           s.value.toLowerCase().indexOf(q) !== -1;
                });
            }

            snippetsGrid.innerHTML = '';

            if (list.length === 0) {
                var empty = document.createElement('div');
                empty.className = 'base-empty';
                empty.style.gridColumn = '1 / -1';

                if (currentSearch && getSnippets().length > 0) {
                    empty.innerHTML =
                        '<div class="base-empty-icon">🔍</div>' +
                        '<div class="base-empty-title">Aucun résultat</div>';
                } else {
                    empty.innerHTML =
                        '<div class="base-empty-icon">📦</div>' +
                        '<div class="base-empty-title">La Base est vide</div>' +
                        '<div class="base-empty-text">Clique sur <b>Nouveau</b> pour créer ton premier snippet.</div>';
                }
                snippetsGrid.appendChild(empty);
                return;
            }

            list.forEach(function(item) {
                snippetsGrid.appendChild(createSnipCard(item));
            });

            if (highlightId) {
                setTimeout(function() {
                    var target = snippetsGrid.querySelector('[data-id="' + highlightId + '"]');
                    if (target) {
                        target.classList.add('highlight');
                        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        setTimeout(function() { target.classList.remove('highlight'); }, 1600);
                    }
                }, 50);
            }
        }

        function createSnipCard(item) {
            var card = document.createElement('div');
            card.className = 'snip-card';
            card.dataset.id = item.id;
            card.style.setProperty('--c', item.color);

            var preview = item.value.length > 80 ? item.value.slice(0, 80) + '…' : item.value;
            preview = preview.replace(/\s+/g, ' ').trim() || '(vide)';

            card.innerHTML =
                '<div class="snip-icon">' + getIconSvg(item.icon) + '</div>' +
                '<div class="snip-text">' +
                    '<div class="snip-name">' + escapeHtml(item.name) + '</div>' +
                    '<div class="snip-preview">' + escapeHtml(preview) + '</div>' +
                '</div>' +
                '<div class="snip-actions">' +
                    '<button class="snip-action edit" title="Modifier" type="button">✎</button>' +
                    '<button class="snip-action delete" title="Supprimer" type="button">🗑</button>' +
                '</div>';

            card.addEventListener('click', function(e) {
                // 🚫 Ignorer les clics fantômes
                if (isClickSuppressed()) {
                    e.stopPropagation();
                    e.preventDefault();
                    return;
                }

                if (e.target.closest('.snip-action')) return;
                copySnippet(item.value, card);
            });

            card.querySelector('.edit').addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                if (isClickSuppressed()) return;
                editSnippet(item);
            });

            card.querySelector('.delete').addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                if (isClickSuppressed()) return;
                deleteSnippet(item);
            });

            return card;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ================================================================
        //  COPIE
        // ================================================================
        function copySnippet(value, card) {
            function done() {
                vibrate(15);
                playSuccessSound();
                if (card) {
                    card.classList.add('copied');
                    setTimeout(function() { card.classList.remove('copied'); }, 900);
                }
                showToast('Copié');
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(value).then(done).catch(function() {
                    legacyCopy(value, done);
                });
            } else {
                legacyCopy(value, done);
            }
        }

        function legacyCopy(value, cb) {
            try {
                var ta = document.createElement('textarea');
                ta.value = value;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                if (cb) cb();
            } catch (e) {
                showToast('Échec de la copie', true);
            }
        }

        // ================================================================
        //  FORMULAIRE
        // ================================================================
        var formOverlay = document.getElementById('form-overlay');
        var formTitle = document.getElementById('form-title');
        var formHeaderIcon = document.getElementById('form-header-icon');
        var formName = document.getElementById('form-name');
        var formValue = document.getElementById('form-value');
        var colorPicker = document.getElementById('color-picker');
        var iconPicker = document.getElementById('icon-picker');
        var editingId = null;
        var selectedColor = DEFAULT_COLOR;
        var selectedIcon = DEFAULT_ICON;

        function buildColorPicker() {
            colorPicker.innerHTML = '';
            COLOR_PALETTE.forEach(function(c) {
                var sw = document.createElement('button');
                sw.type = 'button';
                sw.className = 'color-swatch';
                sw.style.setProperty('--c', c.value);
                sw.title = c.name;
                sw.dataset.color = c.value;
                if (c.value === selectedColor) sw.classList.add('selected');
                sw.addEventListener('click', function(e) {
                    e.preventDefault();
                    setSelectedColor(c.value);
                    vibrate(10);
                    playClickSound();
                });
                colorPicker.appendChild(sw);
            });
        }

        function setSelectedColor(color) {
            selectedColor = color || DEFAULT_COLOR;
            var all = colorPicker.querySelectorAll('.color-swatch');
            for (var i = 0; i < all.length; i++) {
                all[i].classList.toggle('selected', all[i].dataset.color === selectedColor);
            }
        }

        function buildIconPicker() {
            iconPicker.innerHTML = '';
            ICON_LIBRARY.forEach(function(ic) {
                var sw = document.createElement('button');
                sw.type = 'button';
                sw.className = 'icon-swatch';
                sw.title = ic.id;
                sw.dataset.icon = ic.id;
                sw.innerHTML = '<svg viewBox="0 0 24 24">' + ic.svg + '</svg>';
                if (ic.id === selectedIcon) sw.classList.add('selected');
                sw.addEventListener('click', function(e) {
                    e.preventDefault();
                    setSelectedIcon(ic.id);
                    vibrate(10);
                    playClickSound();
                });
                iconPicker.appendChild(sw);
            });
        }

        function setSelectedIcon(iconId) {
            selectedIcon = iconId || DEFAULT_ICON;
            var all = iconPicker.querySelectorAll('.icon-swatch');
            for (var i = 0; i < all.length; i++) {
                all[i].classList.toggle('selected', all[i].dataset.icon === selectedIcon);
            }
        }

        buildColorPicker();
        buildIconPicker();

        function openForm(item) {
            formOverlay.classList.add('open');
            if (item) {
                editingId = item.id;
                formTitle.textContent = 'Modifier';
                formHeaderIcon.textContent = '✎';
                formName.value = item.name;
                formValue.value = item.value;
                setSelectedColor(item.color || DEFAULT_COLOR);
                setSelectedIcon(item.icon || DEFAULT_ICON);
            } else {
                editingId = null;
                formTitle.textContent = 'Nouveau snippet';
                formHeaderIcon.textContent = '✨';
                formName.value = '';
                formValue.value = '';
                setSelectedColor(DEFAULT_COLOR);
                setSelectedIcon(DEFAULT_ICON);
            }
            setTimeout(function() {
                if (window.innerWidth > 640) formName.focus();
            }, 100);
        }

        function closeForm() {
            formOverlay.classList.remove('open');
            editingId = null;
            formName.value = '';
            formValue.value = '';
            selectedColor = DEFAULT_COLOR;
            selectedIcon = DEFAULT_ICON;
        }

        document.getElementById('btn-new').addEventListener('click', function() {
            playClickSound();
            vibrate(12);
            openForm(null);
        });

        document.getElementById('form-close').addEventListener('click', function() {
            playClickSound();
            closeForm();
        });

        document.getElementById('form-cancel').addEventListener('click', function() {
            playClickSound();
            closeForm();
        });

        formOverlay.addEventListener('click', function(e) {
            if (e.target === formOverlay) {
                playClickSound();
                closeForm();
            }
        });

        document.getElementById('form-save').addEventListener('click', function() {
            var name = formName.value.trim();
            var value = formValue.value;
            var color = selectedColor;
            var icon = selectedIcon;

            if (!name) {
                showToast('Nom requis', true);
                formName.focus();
                return;
            }
            if (!value.trim()) {
                showToast('Contenu vide', true);
                formValue.focus();
                return;
            }

            var list = getSnippets();
            var savedId;
            var wasEditing = !!editingId;

            if (wasEditing) {
                for (var i = 0; i < list.length; i++) {
                    if (list[i].id === editingId) {
                        list[i].name = name;
                        list[i].value = value;
                        list[i].color = color;
                        list[i].icon = icon;
                        savedId = list[i].id;
                        break;
                    }
                }
            } else {
                var newItem = {
                    id: generateId(),
                    name: name,
                    value: value,
                    color: color,
                    icon: icon
                };
                list.unshift(newItem);
                savedId = newItem.id;
            }

            saveSnippets(list);
            closeForm();
            renderSnippets(savedId);

            vibrate(20);
            playSuccessSound();
            showToast(wasEditing ? 'Modifié' : 'Ajouté');
        });

        function editSnippet(item) {
            playClickSound();
            vibrate(12);
            openForm(item);
        }

        function deleteSnippet(item) {
            if (!confirm('Supprimer "' + item.name + '" ?')) return;
            var list = getSnippets().filter(function(s) { return s.id !== item.id; });
            saveSnippets(list);
            renderSnippets();
            vibrate([15, 40, 15]);
            playCloseSound();
            showToast('Supprimé');
        }

        // Retour au logo
        document.getElementById('base-header-logo').addEventListener('click', function() {
            playClickSound();
            vibrate(12);
            lockBase();
        });

        // ================================================================
        //  RECHERCHE
        // ================================================================
        var searchInput = document.getElementById('search-input');
        var searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', function() {
            currentSearch = searchInput.value.trim();
            searchClear.classList.toggle('show', currentSearch.length > 0);
            renderSnippets();
        });

        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            currentSearch = '';
            searchClear.classList.remove('show');
            renderSnippets();
            searchInput.focus();
        });

        // ================================================================
        //  HELPERS EXPORT
        // ================================================================
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                return Promise.resolve();
            } catch (e) {
                return Promise.reject(e);
            }
        }

        function downloadFile(filename, content) {
            // Méthode 1 : Blob
            try {
                var blob = new Blob([content], { type: 'application/json;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                    if (a.parentNode) document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 500);
                return true;
            } catch (e1) {
                console.warn('Blob échoué:', e1);
            }

            // Méthode 2 : data URI
            try {
                var dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(content);
                var a2 = document.createElement('a');
                a2.href = dataUri;
                a2.download = filename;
                a2.style.display = 'none';
                a2.rel = 'noopener';
                document.body.appendChild(a2);
                a2.click();
                setTimeout(function() {
                    if (a2.parentNode) document.body.removeChild(a2);
                }, 500);
                return true;
            } catch (e2) {
                console.warn('data URI échoué:', e2);
            }

            // Méthode 3 : msSaveBlob
            try {
                if (window.navigator && window.navigator.msSaveBlob) {
                    var blob3 = new Blob([content], { type: 'application/json' });
                    window.navigator.msSaveBlob(blob3, filename);
                    return true;
                }
            } catch (e3) {
                console.warn('msSaveBlob échoué:', e3);
            }

            return false;
        }

        // ================================================================
        //  EXPORT / IMPORT
        // ================================================================
        var fileInput = document.getElementById('file-input');

        document.getElementById('btn-export').addEventListener('click', function() {
            var list = getSnippets();
            if (list.length === 0) {
                showToast('Rien à exporter', true);
                return;
            }

            var data = {
                app: 'La Base',
                version: 4,
                exportedAt: new Date().toISOString(),
                snippets: list
            };

            var jsonStr = JSON.stringify(data, null, 2);
            var filename = 'la-base-' + new Date().toISOString().slice(0, 10) + '.json';

            var success = downloadFile(filename, jsonStr);

            vibrate(15);
            playSuccessSound();

            if (success) {
                showToast(list.length + ' snippet(s) exporté(s)');
            } else {
                copyToClipboard(jsonStr).then(function() {
                    showToast('JSON copié dans le presse-papier');
                }).catch(function() {
                    showToast('Échec de l\'export', true);
                });
            }
        });

        document.getElementById('btn-import').addEventListener('click', function() {
            playClickSound();
            vibrate(12);
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    var parsed = JSON.parse(ev.target.result);
                    var incoming = [];

                    if (Array.isArray(parsed)) incoming = parsed;
                    else if (parsed && Array.isArray(parsed.snippets)) incoming = parsed.snippets;
                    else throw new Error('Format invalide');

                    incoming = incoming.filter(function(s) {
                        return s && typeof s.name === 'string' && typeof s.value === 'string';
                    }).map(function(s) {
                        return {
                            id: s.id || generateId(),
                            name: s.name,
                            value: s.value,
                            color: s.color || DEFAULT_COLOR,
                            icon: s.icon || DEFAULT_ICON
                        };
                    });

                    if (incoming.length === 0) {
                        showToast('Aucun snippet valide', true);
                        return;
                    }

                    var replace = confirm(
                        'Importer ' + incoming.length + ' snippet(s).\n\n' +
                        'OK = Remplacer\n' +
                        'Annuler = Ajouter'
                    );

                    var finalList = replace ? incoming : getSnippets().concat(incoming);

                    saveSnippets(finalList);
                    renderSnippets();
                    vibrate(20);
                    playSuccessSound();
                    showToast(incoming.length + ' importé(s)');

                } catch (err) {
                    showToast('JSON invalide', true);
                } finally {
                    fileInput.value = '';
                }
            };
            reader.onerror = function() {
                showToast('Erreur de lecture', true);
                fileInput.value = '';
            };
            reader.readAsText(file);
        });

        // ================================================================
        //  TOAST
        // ================================================================
        var toastEl = document.getElementById('toast');
        var toastTimer = null;
        function showToast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.classList.toggle('error', !!isError);
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // ================================================================
        //  ONGLETS PWA
        // ================================================================
        function buildTabs() {
            var tabs = document.getElementById('tabs-container');
            tabs.innerHTML = '';

            pwaList.forEach(function(pwa) {
                var socket = document.createElement('div');
                socket.className = 'btn-socket';
                socket.id = 'btn-' + pwa.id;
                socket.dataset.id = pwa.id;

                var led = document.createElement('div');
                led.className = 'led';
                socket.appendChild(led);

                var btn = document.createElement('button');
                btn.className = 'pwa-btn';
                btn.textContent = pwa.name;
                socket.appendChild(btn);

                socket.addEventListener('mouseenter', function() {
                    if (socket.classList.contains('active')) return;
                    socket.style.borderColor = pwa.colorDim;
                    socket.style.boxShadow = '0 6px 20px rgba(0,0,0,0.3), 0 0 12px ' + pwa.colorBgSoft;
                });
                socket.addEventListener('mouseleave', function() {
                    if (socket.classList.contains('active')) return;
                    socket.style.borderColor = '';
                    socket.style.boxShadow = '';
                });

                socket.addEventListener('click', function(e) {
                    // 🚫 Ignorer les clics fantômes
                    if (isClickSuppressed()) {
                        e.stopPropagation();
                        e.preventDefault();
                        return;
                    }

                    socket.classList.add('tapping');
                    setTimeout(function() { socket.classList.remove('tapping'); }, 260);

                    var isClosing = activePwaId === pwa.id;
                    if (isClosing) {
                        vibrate([8, 30, 8]);
                        playCloseSound();
                    } else {
                        vibrate(15);
                        playOpenSound();
                    }
                    togglePwa(pwa.id);
                });

                tabs.appendChild(socket);
            });
        }

        function createCard(pwa) {
            var container = document.getElementById('cards-container');
            var card = document.createElement('div');
            card.className = 'pwa-single hidden-card';
            card.id = 'card-' + pwa.id;
            card.style.borderColor = pwa.colorDim;

            var header = document.createElement('div');
            header.className = 'pwa-card-header';
            header.innerHTML = '<span class="pwa-card-title" style="color:' + pwa.color + ';">' +
                '<span class="dot" style="background:' + pwa.color + '; box-shadow:0 0 10px ' + pwa.color + ';"></span>' +
                pwa.name +
                '<span class="pwa-card-url">' + pwa.url + '</span>' +
                '</span>' +
                '<button class="pwa-card-reload" title="Recharger">⟳</button>';
            header.querySelector('.pwa-card-reload').addEventListener('click', function(e) {
                e.stopPropagation();
                vibrate(10);
                playClickSound();
                var iframe = card.querySelector('iframe');
                if (iframe) {
                    var loader = card.querySelector('.pwa-loader');
                    if (loader) loader.classList.remove('hidden');
                    iframe.src = iframe.src;
                }
            });

            var body = document.createElement('div');
            body.className = 'pwa-card-body';

            var loader = document.createElement('div');
            loader.className = 'pwa-loader';
            loader.style.color = pwa.color;
            loader.innerHTML = '<div class="spinner" style="border-color:' + pwa.colorBg + '; border-top-color:' + pwa.color + ';"></div><div>Chargement…</div>';
            body.appendChild(loader);

            var iframe = document.createElement('iframe');
            iframe.id = 'iframe-' + pwa.id;
            iframe.src = pwa.url;
            iframe.setAttribute('scrolling', 'auto');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups');
            iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

            var loaded = false;
            iframe.addEventListener('load', function() {
                loaded = true;
                loader.classList.add('hidden');
            });

            setTimeout(function() {
                if (!loaded) showError(body, pwa);
            }, 12000);

            iframe.addEventListener('error', function() {
                showError(body, pwa);
            });

            body.appendChild(iframe);
            card.appendChild(header);
            card.appendChild(body);
            container.appendChild(card);
        }

        function showError(container, pwa) {
            if (container.querySelector('.pwa-error')) return;
            var loader = container.querySelector('.pwa-loader');
            if (loader) loader.classList.add('hidden');
            var iframe = container.querySelector('iframe');
            if (iframe) iframe.style.visibility = 'hidden';

            var err = document.createElement('div');
            err.className = 'pwa-error';
            err.innerHTML = '<div class="err-icon">⚠️</div>' +
                '<div class="err-title">Page introuvable</div>' +
                '<div class="err-msg">Cette URL ne répond pas.</div>' +
                '<div class="err-url">' + pwa.url + '</div>' +
                '<button class="err-btn" style="background:' + pwa.colorBg + '; border-color:' + pwa.colorDim + '; color:' + pwa.color + ';">Réessayer</button>';
            err.querySelector('.err-btn').addEventListener('click', function() {
                err.remove();
                if (iframe) {
                    iframe.style.visibility = 'visible';
                    iframe.src = iframe.src;
                }
                if (loader) loader.classList.remove('hidden');
            });
            container.appendChild(err);
        }

        function updateVisibility() {
            var homeScreen = document.getElementById('home-screen');

            pwaList.forEach(function(pwa) {
                var card = document.getElementById('card-' + pwa.id);
                if (!card) return;
                if (pwa.id === activePwaId) {
                    card.classList.add('visible');
                    card.classList.remove('hidden-card');
                } else {
                    card.classList.remove('visible');
                    card.classList.add('hidden-card');
                }
            });

            if (activePwaId) homeScreen.classList.remove('visible');
            else homeScreen.classList.add('visible');

            pwaList.forEach(function(pwa) {
                var socket = document.getElementById('btn-' + pwa.id);
                if (!socket) return;
                var isActive = pwa.id === activePwaId;
                var led = socket.querySelector('.led');
                var btn = socket.querySelector('.pwa-btn');

                if (isActive) {
                    socket.classList.add('active');
                    socket.style.background = pwa.colorBg;
                    socket.style.borderColor = pwa.colorDim;
                    socket.style.boxShadow = '0 0 24px ' + pwa.colorBgSoft + ', inset 0 0 24px ' + pwa.colorBgSoft;
                    led.style.background = pwa.color;
                    led.style.boxShadow = '0 0 14px ' + pwa.color;
                    btn.style.color = pwa.color;
                } else {
                    socket.classList.remove('active');
                    socket.style.background = '';
                    socket.style.borderColor = '';
                    socket.style.boxShadow = '';
                    led.style.background = '#3c465a';
                    led.style.boxShadow = 'inset 0 1px 2px rgba(0,0,0,0.6)';
                    btn.style.color = '#94a0b8';
                }
            });
        }

        function togglePwa(id) {
            if (activePwaId === id) {
                activePwaId = null;
            } else {
                if (!loadedPwas[id]) {
                    var pwa = pwaList.find(function(p) { return p.id === id; });
                    if (pwa) {
                        createCard(pwa);
                        loadedPwas[id] = true;
                    }
                }
                activePwaId = id;
            }
            saveActive();
            updateVisibility();
        }

        window.addEventListener('message', function(event) {
            var msg = event.data;
            if (msg && msg.type === 'HUB_ROUTER' && msg.target) {
                var iframe = document.getElementById('iframe-' + msg.target);
                if (iframe) iframe.contentWindow.postMessage(msg.payload, '*');
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (formOverlay.classList.contains('open')) closeForm();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
            });
        }

        // ================================================================
        //  INIT
        // ================================================================
        activePwaId = null;
        buildTabs();
        renderSnippets();
        updateVisibility();
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
